    <script>
      (function () {
        try {
          var mode = localStorage.getItem("portfolioThemeModeV1") || "auto";
          if (mode === "light" || mode === "dark") {
            document.documentElement.dataset.theme = mode;
            return;
          }
          var tz = localStorage.getItem("portfolioHeroTzV1") || "local";
          var h;
          if (!tz || tz === "local") {
            var d = new Date();
            h = d.getHours() + d.getMinutes() / 60;
          } else {
            try {
              var parts = new Intl.DateTimeFormat("en-US", {
                hour: "numeric",
                minute: "numeric",
                hourCycle: "h23",
                timeZone: tz
              }).formatToParts(new Date());
              var hour = Number(parts.find(function (p) { return p.type === "hour"; }).value);
              var minute = Number(parts.find(function (p) { return p.type === "minute"; }).value);
              h = (hour === 24 ? 0 : hour) + minute / 60;
            } catch (err) {
              var d2 = new Date();
              h = d2.getHours() + d2.getMinutes() / 60;
            }
          }
          document.documentElement.dataset.theme = h >= 4.5 && h < 17 ? "light" : "dark";
        } catch (err) {}
      })();
    </script>
